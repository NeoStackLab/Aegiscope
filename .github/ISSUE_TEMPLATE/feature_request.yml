name: Feature request
description: Suggest a user-facing capability or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What should the user be able to understand or do?
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, performance or usability considerations
    validations:
      required: false
